apiVersion: apps/v1
kind: Deployment
metadata:
  name: ggr-trafic
  labels:
    app.kubernetes.io/name: ggr-trafic
    app.kubernetes.io/component: web
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ggr-trafic
      app.kubernetes.io/component: web
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ggr-trafic
        app.kubernetes.io/component: web
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      securityContext:
        fsGroup: 1000
      containers:
        - name: web
          image: ggr-trafic:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: GGR_DATA_DIR
              value: /data
            - name: GGR_CONFIG
              value: /config/config.yaml
            - name: GGR_SCHEDULER
              value: "0"
            - name: GGR_RECORDER_URL
              value: http://ggr-trafic-recorder:8080
            - name: GGR_ADMIN_TOKEN
              valueFrom:
                secretKeyRef:
                  name: ggr-trafic-secrets
                  key: admin-token
                  optional: true
            - name: GGR_GOOGLE_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: ggr-trafic-secrets
                  key: google-client-id
                  optional: true
            - name: GGR_GOOGLE_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: ggr-trafic-secrets
                  key: google-client-secret
                  optional: true
            - name: GGR_SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  name: ggr-trafic-secrets
                  key: session-secret
                  optional: true
            - name: GGR_SESSION_SECURE
              value: "1"
            - name: GGR_PUBLIC_URL
              value: https://ggr-trafic.k3s.lpb.ovh
            - name: GGR_SMTP_HOST
              valueFrom:
                secretKeyRef:
                  name: ggr-trafic-secrets
                  key: smtp-host
                  optional: true
            - name: GGR_SMTP_PORT
              valueFrom:
                secretKeyRef:
                  name: ggr-trafic-secrets
                  key: smtp-port
                  optional: true
            - name: GGR_SMTP_USER
              valueFrom:
                secretKeyRef:
                  name: ggr-trafic-secrets
                  key: smtp-user
                  optional: true
            - name: GGR_SMTP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ggr-trafic-secrets
                  key: smtp-password
                  optional: true
            - name: GGR_SMTP_FROM
              valueFrom:
                secretKeyRef:
                  name: ggr-trafic-secrets
                  key: smtp-from
                  optional: true
          resources:
            requests:
              cpu: 250m
              memory: 384Mi
            limits:
              cpu: "1"
              memory: 1Gi
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 8
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 36
          volumeMounts:
            - name: data
              mountPath: /data
            - name: config
              mountPath: /config
              readOnly: true
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: ggr-trafic-data
        - name: config
          configMap:
            name: ggr-trafic-config
