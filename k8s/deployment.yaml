apiVersion: apps/v1
kind: Deployment
metadata:
  name: ggr-trafic
  labels:
    app.kubernetes.io/name: ggr-trafic
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ggr-trafic
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ggr-trafic
    spec:
      securityContext:
        fsGroup: 1000
      containers:
        - name: web
          image: ggr-trafic:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: GGR_DATA_DIR
              value: /data
            - name: GGR_CONFIG
              value: /config/config.yaml
            - name: GGR_ADMIN_TOKEN
              valueFrom:
                secretKeyRef:
                  name: ggr-trafic-secrets
                  key: admin-token
                  optional: true
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 3Gi
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 30
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            failureThreshold: 36
          volumeMounts:
            - name: data
              mountPath: /data
            - name: config
              mountPath: /config
              readOnly: true
            - name: dshm
              mountPath: /dev/shm
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: ggr-trafic-data
        - name: config
          configMap:
            name: ggr-trafic-config
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 1Gi
