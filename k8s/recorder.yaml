# Enregistreur isolé : Chromium / Kiwi ne saturent plus l’UI.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ggr-trafic-recorder
  labels:
    app.kubernetes.io/name: ggr-trafic
    app.kubernetes.io/component: recorder
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ggr-trafic
      app.kubernetes.io/component: recorder
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ggr-trafic
        app.kubernetes.io/component: recorder
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      securityContext:
        fsGroup: 1000
      containers:
        - name: recorder
          image: ggr-trafic:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: GGR_DATA_DIR
              value: /data
            - name: GGR_CONFIG
              value: /config/config.yaml
            - name: GGR_SCHEDULER
              value: "1"
            - name: GGR_ADMIN_TOKEN
              valueFrom:
                secretKeyRef:
                  name: ggr-trafic-secrets
                  key: admin-token
                  optional: true
          resources:
            requests:
              cpu: 400m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2500Mi
          # Pas de liveness HTTP : Playwright bloque la boucle, kubelet tuait le pod (exit 137).
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 36
          volumeMounts:
            - name: data
              mountPath: /data
            - name: config
              mountPath: /config
              readOnly: true
            - name: dshm
              mountPath: /dev/shm
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: ggr-trafic-data
        - name: config
          configMap:
            name: ggr-trafic-config
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: ggr-trafic-recorder
  labels:
    app.kubernetes.io/name: ggr-trafic
    app.kubernetes.io/component: recorder
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: ggr-trafic
    app.kubernetes.io/component: recorder
  ports:
    - name: http
      port: 8080
      targetPort: http
