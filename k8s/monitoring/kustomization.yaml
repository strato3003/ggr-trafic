apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - rbac.yaml
  - node-exporter.yaml
  - kube-state-metrics.yaml
  - prometheus.yaml
  - loki.yaml
  - promtail.yaml
  - grafana.yaml
generatorOptions:
  disableNameSuffixHash: true
configMapGenerator:
  - name: k3s-grafana-dashboard-visites
    namespace: monitoring
    files:
      - ggr-visites.json=dashboards/ggr-visites.json
