<span class="live js-rec"{% if not recording_state.active %} hidden{% endif %} data-ends="{{ recording_state.ends_at or '' }}" role="status">
  <span class="live__dot" aria-hidden="true"></span>
  <span class="js-rec-label">{{ recording_state.label or 'Enregistrement' }} en cours</span>
  <span class="js-rec-clock">{{ recording_state.remaining_hms or '00:00:00' }}</span>
</span>
