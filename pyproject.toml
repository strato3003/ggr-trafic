[project]
name = "ggr-trafic"
version = "1.1.19"
description = "Enregistrement du trafic HF F6KUF / flotte Golden Globe Race"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "GGR Trafic" }]
dependencies = [
    "apscheduler>=3.10.4",
    "fastapi>=0.115.0",
    "httpx>=0.27.0",
    "jinja2>=3.1.4",
    "authlib>=1.3.0",
    "itsdangerous>=2.2.0",
    "pillow>=11.0.0",
    "prometheus-client>=0.21.0",
    "playwright==1.50.0",
    "pydantic>=2.9.0",
    "python-multipart>=0.0.12",
    "pyyaml>=6.0.2",
    "uvicorn[standard]>=0.32.0",
    "websockets>=14.0",
    "edge-tts>=7.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3.0"]

[project.scripts]
ggr-trafic = "app.main:run"
ggr-vacations = "app.main:run"
ggr-record = "recorder.session:main"
ggr-operators = "app.operators:main"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*", "recorder*"]

[tool.setuptools.package-data]
app = ["templates/*.html", "static/css/*", "static/js/*", "static/geo/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
