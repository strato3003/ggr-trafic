# Configuration GGR Trafic — F6KUF / flotte Golden Globe Race
version: "2.2.2"

club:
  callsign: F6KUF
  name: "Radio-club F6KUF"

# QTH d’émission (max 5). Pointillé globe → centroïde des skippers suivis.
# France : Guy F4DAI / F6KUF, Saint-Christophe-du-Ligneron.
# Commune : 46°49′30″ N, 1°45′43″ W (Wikipédia).
# Philippe F4HWM (Talmont-Saint-Hilaire) n’émet plus le bulletin.
tx_sites:
  - label: Guy F4DAI / F6KUF
    loc: Saint-Christophe-du-Ligneron, Vendée
    lat: 46.82500
    lon: -1.76194
  - label: Cap Town
    lat: -33.9249
    lon: 18.4241
  - label: Michel FO5QB / F6KUF
    loc: Tahiti
    lat: -17.5350
    lon: -149.5697

# F6KUF : lundi et jeudi 18:00 TU. Michel FO5QB : tous les jours 18:00 TU.
schedule:
  # Heure TU du bulletin météo (H)
  time_utc: "18:00"
  days: [mon, thu]
  tahiti_daily: true
  # Démarrer 1 min avant H (calage Kiwi / VFO).
  lead_minutes: 1
  # Durée totale session : bulletin 14.135 MHz seulement.
  duration_minutes: 25

radio:
  mode: usb
  usb_filter:
    low_hz: 300
    high_hz: 2700
  tx:
    freq_khz: 14135.0
    # Le club peut être à ± 5 kHz de la QRG nominale (QRM / QSY)
    qrg_tolerance_khz: 5.0
    label: "Bulletin météo F6KUF"
    zoom: 10

# Position moyenne de la flotte GGR (Yellowbrick)
fleet:
  source: yellowbrick
  race_id: ggr2026
  tracker_host: cf.yb.tl
  # Ignorer les traces « fantômes » historiques (Moitessier, RKJ, etc.)
  skip_team_id_from: 900
  # Skippers suivis pour le centroïde d’écoute (bulletin) — noms Yellowbrick RaceSetup.
  # Sans fleet.groups, cette liste est le centre. Groupes optionnels : tete, centre, queue.
  # Moins de 800 km entre groupes : un seul faisceau (4 à 6 Kiwi). Au-delà : 2 Kiwi par groupe.
  skippers:
    - "Damien Guillou"
    - "Etienne Messikommer"
    - "Louis Kerdelhue"
  # Repli si le tracker est indisponible (Les Sables-d'Olonne)
  fallback:
    lat: 46.5025
    lon: -1.7888
    label: "Les Sables-d'Olonne (repli)"

sdr:
  # Liste publique KiwiSDR (JS, virgules finales possibles)
  directory_url: "http://rx.linkfanel.net/kiwisdr_com.js"
  ident_user: ggr-trafic
  # Places libres minimales pour le screencast du bulletin (navigateur = 1 slot).
  min_free_slots: 2
  # Couverture du bulletin 14.135 MHz (bande 20 m, 14.000–14.350 MHz).
  min_freq_hz: 14000000
  max_freq_hz: 14350000
  screencast_tx: true
  # 4 à 6 Kiwi sur 14.135 MHz dans le faisceau TX → flotte.
  # Le plus proche des bateaux est prioritaire (screencast, qualité à bord).
  # min_along 0,12 : les Canaries restent dans le cône Vendée → Atlantique.
  beam:
    count: 6
    min_fleet_km: 0
    min_tx_km: 400
    max_xt_km: 1800
    max_daz_deg: 22
    min_separation_km: 350
    min_path_km: 800
    max_tx_km: 14000
    min_along: 0.12
    # 1,55 : inclut la première terre au-delà des bateaux (pas l’autre hémisphère).
    max_along: 1.55
  viewport:
    width: 1280
    height: 800
  # QTH club (France / Cap Town / Tahiti) : info UI / hint prop, plus de voies TX dédiées.
  # QRG d’enregistrement = 14135.0 kHz (pas de chasse USB sur le trafic programmé).
  sites:
    france:
      # Saint-Christophe-du-Ligneron, Vendée — Guy F4DAI / F6KUF.
      # 46°49′30″ N, 1°45′43″ W (Wikipédia, commune).
      lat: 46.82500
      lon: -1.76194
      label: Guy F4DAI / F6KUF
      radius_km: 1500
    cape:
      # Le Cap 33°55′30″S 18°25′27″E — recouvrement SA / début Indien
      lat: -33.9249
      lon: 18.4241
      label: Cap Town
      radius_km: 2000
    tahiti:
      # Papeete 17°32′6″S 149°34′11″W — Michel FO5QB / F6KUF
      lat: -17.5350
      lon: -149.5697
      label: Michel FO5QB / F6KUF
      radius_km: 2500

storage:
  data_dir: /data
  # PVC 5 Gio : bulletin 14.135 MHz (screencast + audio) — rétention ~14 jours
  retention_days: 14

web:
  title: "GGR Trafic"
  host: "0.0.0.0"
  port: 8080
  # Jeton pour déclencher un enregistrement manuel (POST /api/trafic/record)
  admin_token: ""
  # Page d’attente (globe 3D flouté) : incident manifeste ou maintenance.
  unavailable: false
  # Calques globe à l’arrivée (un visiteur peut encore les changer localement).
  display:
    banner: true
    sdr_fleet: true
    sdr_potential: false
    labels_sdr: true
    sdr_distance: true
    boats: true
    labels_boats: true
    metarea: true
    subzones: true

# Hôte Ingress Traefik + Let's Encrypt
ingress:
  host: ggr-trafic.k3s.lpb.ovh
