# Configuration GGR Trafic — F6KUF / flotte Golden Globe Race
version: "1.1.23"

club:
  callsign: F6KUF
  name: "Radio-club F6KUF"

# QTH d’émission (max 5). Pointillé globe → centroïde des skippers suivis.
# Semaine du 21 sept. 2026 : Philippe F4HWM / F6KUF depuis Talmont-Saint-Hilaire
# (habituellement Guy F4DAI / F6KUF, Saint-Christophe-du-Ligneron).
tx_sites:
  - label: Philippe F4HWM / F6KUF
    loc: Talmont-Saint-Hilaire, Vendée
    lat: 46.46806
    lon: -1.61694
  - label: Cap Town
    lat: -33.9249
    lon: 18.4241
  - label: Michel FO5QB / F6KUF
    loc: Tahiti
    lat: -17.5350
    lon: -149.5697

# F6KUF : lundi et jeudi 18:00 TU. Michel FO5QB : tous les jours 18:00 TU.
schedule:
  # Heure TU du bulletin météo (H)
  time_utc: "18:00"
  days: [mon, thu]
  tahiti_daily: true
  # Démarrer 1 min avant H (calage Kiwi / VFO).
  lead_minutes: 1
  # Durée totale session (bulletin dès le début + ACK après H+10).
  duration_minutes: 25
  # Accusés seulement après la lecture du bulletin (H+10 TU).
  ack_delay_minutes: 10

radio:
  mode: usb
  usb_filter:
    low_hz: 300
    high_hz: 2700
  tx:
    freq_khz: 14135.0
    # Le club peut être à ± 5 kHz de la QRG nominale (QRM / QSY)
    qrg_tolerance_khz: 5.0
    label: "Bulletin météo F6KUF"
    zoom: 10
  ack:
    # Le « 5 » final des anciennes notations 16.5515 / 12.4185 était la tolérance ± 5 kHz.
    - freq_khz: 16551.0
      label: "Accusé 16,551 MHz"
      zoom: 10
    - freq_khz: 12418.0
      label: "Accusé 12,418 MHz"
      zoom: 10

# Buddy call quotidien (skippers entre eux, pas le bulletin F6KUF)
buddy:
  enabled: true
  time_utc: "12:00"
  lead_minutes: 1
  duration_minutes: 15
  mode: usb
  main:
    freq_khz: 4483.0
    label: "Buddy call 4483 kHz"
    # Zoom 12 → ~7,3 kHz : la USB 2,4 kHz reste lisible (z10 ≈ 29 kHz la noie).
    zoom: 12
  alternate:
    freq_khz: 6516.0
    label: "Buddy call 6516 kHz (secours)"
    zoom: 12
  # QRG d’écoute supplémentaires (réparties sur les Kiwi selon places libres).
  extras:
    - freq_khz: 8294.0
      label: "Buddy call 8294 kHz"
      zoom: 12
    - freq_khz: 12353.0
      label: "Buddy call 12353 kHz"
      zoom: 12
  centroid:
    # Noms Yellowbrick RaceSetup (ggr2026). Le centroïde (bulletin et buddy)
    # est uniquement celui de ces skippers, jamais le reste de la flotte.
    skippers:
      - "Damien Guillou"
      - "Etienne Messikommer"
      - "Louis Kerdelhue"
  kiwi:
    # ≤2 QRG / Kiwi ; 4/6 MHz sur NVIS (proche flotte), 8/12 MHz sur saut.
    # 4–10 omni autour du centroïde (azimuts répartis).
    count: 6
    min_separation_km: 400
    min_free_slots: 2

# Position moyenne de la flotte GGR (Yellowbrick)
fleet:
  source: yellowbrick
  race_id: ggr2026
  tracker_host: cf.yb.tl
  # Ignorer les traces « fantômes » historiques (Moitessier, RKJ, etc.)
  skip_team_id_from: 900
  # Repli si le tracker est indisponible (Les Sables-d'Olonne)
  fallback:
    lat: 46.5025
    lon: -1.7888
    label: "Les Sables-d'Olonne (repli)"

sdr:
  # Liste publique KiwiSDR (JS, virgules finales possibles)
  directory_url: "http://rx.linkfanel.net/kiwisdr_com.js"
  ident_user: ggr-trafic
  # Places libres minimales pour le screencast TX (navigateur = 1 slot).
  # Les ACK n’ont besoin que d’un flux SND (1 place).
  min_free_slots: 2
  # Couverture HF nécessaire (Hz)
  min_freq_hz: 12000000
  max_freq_hz: 17000000
  screencast_tx: true
  screencast_ack: false
  # Bulletin 14.135 : un seul Kiwi près du centroïde (vérifier la diffusion) + screencast.
  # Les faisceaux TX→flotte sont désactivés (count: 0) ; la portée se juge au centroïde.
  beam:
    count: 0
    min_fleet_km: 800
    min_tx_km: 400
    max_xt_km: 1500
    max_daz_deg: 16
    min_separation_km: 400
    min_path_km: 1500
    max_tx_km: 12000
    min_along: 0.75
  # ACK 12.418 / 16.551 : 4–5 Kiwi omni autour du centroïde (2 QRG / SDR).
  ack_omni:
    count: 5
    min_separation_km: 400
  viewport:
    width: 1280
    height: 800
  # QTH club (France / Cap Town / Tahiti) : info UI / hint prop, plus de voies TX dédiées.
  # QRG d’enregistrement = 14135.0 kHz (pas de chasse USB sur le trafic programmé).
  sites:
    france:
      # Talmont-Saint-Hilaire, Vendée — Philippe F4HWM / F6KUF (semaine du 21 sept. 2026)
      # WGS84 46.46806°N 1.61694°W (Wikipedia, commune).
      lat: 46.46806
      lon: -1.61694
      label: Philippe F4HWM / F6KUF
      radius_km: 1500
    cape:
      # Le Cap 33°55′30″S 18°25′27″E — recouvrement SA / début Indien
      lat: -33.9249
      lon: 18.4241
      label: Cap Town
      radius_km: 2000
    tahiti:
      # Papeete 17°32′6″S 149°34′11″W — Michel FO5QB / F6KUF
      lat: -17.5350
      lon: -149.5697
      label: Michel FO5QB / F6KUF
      radius_km: 2500

storage:
  data_dir: /data
  # PVC 5 Gio : 10 min (screencast + bulletin + 2 QRG × 3 sites) ≈ 150–220 Mio → ~14 jours
  retention_days: 14

web:
  title: "GGR Trafic"
  host: "0.0.0.0"
  port: 8080
  # Jeton pour déclencher un enregistrement manuel (POST /api/trafic/record)
  admin_token: ""
  # Page d’attente (globe 3D flouté) : incident manifeste ou maintenance.
  unavailable: false
  # Calques globe à l’arrivée (un visiteur peut encore les changer localement).
  display:
    banner: true
    sdr_fleet: true
    sdr_potential: false
    labels_sdr: true
    sdr_distance: true
    boats: true
    labels_boats: true
    metarea: true
    subzones: true

# Hôte Ingress Traefik + Let's Encrypt
ingress:
  host: ggr-trafic.k3s.lpb.ovh
